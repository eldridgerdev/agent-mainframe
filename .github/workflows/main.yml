name: CI

on:
  push:
    branches: ["main", "master", "testing"]
    tags-ignore:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

# A newer push to a pull request supersedes the run for the older one. Pushes
# and the scheduled audit key on their own run, so they never cancel: a commit
# id would be shared by one commit reaching two refs (main fast-forwarded to
# testing), and the main run is the one that saves the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A fresh checkout rebuilds the workspace crates every run, so incremental
  # state is never reused and full debuginfo only slows codegen and linking.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    # Preserve the existing Linux check name used by branch protection.
    name: ${{ matrix.check_name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            check_name: Test
          - runner: macos-latest
            check_name: Test (macOS)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux test prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config git tmux bash coreutils procps \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - name: Install macOS test prerequisites
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Verify test prerequisites
        shell: bash
        run: |
          for tool in git tmux sh bash ps sleep mkfifo cc python3; do
            command -v "$tool"
          done
          rustc --version
          cargo --version

      # Keyed per job and platform by the action: `Test` needs codegen
      # artifacts and `Lint` only check metadata, so one shared key lets
      # whichever job saves first leave the other compiling every dependency.
      # Only main writes; pull requests read its cache.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        run: cargo test --workspace --locked --verbose

      # Real tmux on test-owned sockets, against a stand-in amf: no build needed.
      - name: Screenshot capture isolation tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/dev/screenshot -p 'test_capture_isolation.py' -v

      - name: Native TUI driver smoke
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --bin amf
          python3 scripts/dev/tui-driver/smoke.py
          python3 scripts/dev/tui-driver/new_user_path.py

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Keyed per job and platform by the action: `Test` needs codegen
      # artifacts and `Lint` only check metadata, so one shared key lets
      # whichever job saves first leave the other compiling every dependency.
      # Only main writes; pull requests read its cache.
      - name: Cache cargo registry and dependency builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo fmt
        run: cargo fmt --check

  gui-frontend:
    name: GUI frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend interaction tests
        run: npm test

      - name: AI driver protocol and lifecycle tests
        run: |
          python3 ../scripts/dev/test_ai_driver.py
          python3 ../scripts/dev/gui-driver/test_driver.py
          python3 ../scripts/dev/tui-driver/test_driver.py

      - name: Typecheck and build
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Building the pinned tool from source takes minutes; keep the binary.
      # Restore and save are separate steps because the combined action only
      # saves when the job succeeds, and this job fails on any open advisory.
      - name: Restore pinned cargo-audit
        id: cargo-audit
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install audit build prerequisites
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install pinned cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Save pinned cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.cargo-audit.outputs.cache-primary-key }}

      # RUSTSEC-2026-0387 (crypto-bigint via web-push-native) is ignored until #779.
      - name: Audit locked dependencies against RustSec
        run: cargo audit --file Cargo.lock --ignore RUSTSEC-2026-0387
