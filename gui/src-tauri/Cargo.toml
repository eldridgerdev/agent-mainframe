[package]
name = "amf-gui"
version = "0.1.0"
description = "AMF GUI shell (Tauri) — additive alongside the amf TUI, sharing amf's core library"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Path dependency on the existing TUI package's library target: see
# AMF_PLAN.md's package-layout decision. This intentionally pulls in
# ratatui/crossterm/vt100 the GUI does not use yet rather than forcing an
# upfront presentation-free core-crate split.
agent-mainframe = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "amf-gui"
path = "src/main.rs"
