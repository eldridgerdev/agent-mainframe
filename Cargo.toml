[package]
name = "agent-mainframe"
version = "0.31.0"
edition = "2024"
description = "Terminal dashboard for running many AI coding agents in parallel — each on its own branch, in its own tmux session"
license = "MIT"
repository = "https://github.com/eldridgerdev/agent-mainframe"
readme = "README.md"
keywords = ["tui", "tmux", "agents", "claude", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "amf"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
throbber-widgets-tui = "0.8"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
vt100 = "0.15"
ratatui-explorer = "0.2"
ureq = { version = "3", default-features = false, features = ["gzip", "platform-verifier", "rustls"] }
unicode-width = "0.1"
regex = "1"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.26"
pulldown-cmark = "0.13"
tempfile = "3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8.2.0"

[dev-dependencies]
mockall = "0.13"
pretty_assertions = "1"
