<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi-powered plan interviews — visual proof</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #151515; color: #eee; }
    main { width: min(1240px, calc(100% - 32px)); margin: 32px auto 64px; }
    h1 { margin-bottom: 8px; font-size: 1.6rem; }
    .context { margin: 0 0 28px; color: #aaa; }
    figure { margin: 0 0 28px; border: 1px solid #444; border-radius: 8px; overflow: hidden; background: #202020; }
    .bar { padding: 8px 12px; border-bottom: 1px solid #444; color: #bbb; font: 13px ui-monospace, monospace; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 12px 14px; line-height: 1.45; color: #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>Pi-powered plan interviews</h1>
    <p class="context">plan-mode branch · isolated AMF scratch instance · deterministic Pi fixture · no provider tokens used</p>
    <figure>
      <div class="bar">01 · Harness verification</div>
      <img src="002-pi-harness-verified.png" alt="AMF harness manager showing Pi installed">
      <figcaption>Pi passes AMF's harness check before it is enabled for the scratch workspace.</figcaption>
    </figure>
    <figure>
      <div class="bar">02 · Explicit AI choice</div>
      <img src="004-pi-ai-choice.png" alt="Plan interview optional AI choice">
      <figcaption>The existing consent gate distinguishes token-using follow-ups and synthesis from raw-plan review.</figcaption>
    </figure>
    <figure>
      <div class="bar">03 · Pi selected</div>
      <img src="005-pi-headless-selected.png" alt="Plan interview loading frame naming Pi as its engine">
      <figcaption>The new behavior: the plan interview selects Pi for its restricted headless follow-up call.</figcaption>
    </figure>
  </main>
</body>
</html>
