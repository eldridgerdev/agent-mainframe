name: AMF screenshot Pages preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pushed branch or ref containing the scenario and code
        required: true
        type: string
      scenario:
        description: Repository-relative scenario file
        required: true
        type: string
      pr_number:
        description: Pull request receiving the artifact link
        required: true
        type: string
      summary:
        description: One-sentence explanation of the flow being proved
        required: true
        type: string
      geometry:
        description: Capture geometry, for example 120x40
        required: false
        default: 120x40
        type: string
      gif:
        description: Also assemble an animated GIF
        required: false
        default: false
        type: boolean
      request_id:
        description: Unique request identifier used by the invoking agent
        required: true
        type: string
      seed:
        description: Optional repository-relative project seed JSON
        required: false
        type: string
      seed_feature:
        description: Optional repository-relative feature seed JSON
        required: false
        type: string
      config:
        description: Optional repository-relative AMF config JSON
        required: false
        type: string

run-name: AMF screenshot ${{ inputs.request_id }} (PR #${{ inputs.pr_number }})

# One capture/deploy at a time prevents a collaborator from creating a burst of
# Pages deployments or consuming a fleet of runners. Do not cancel an active
# visual proof run: it may already be awaiting human environment approval.
concurrency:
  group: amf-screenshot-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    # workflow_dispatch requires write access, but screenshot publication is
    # intentionally narrower: agents must use the owner's authenticated gh
    # session. Add a separate explicitly reviewed identity here if needed.
    if: github.actor == 'eldridgerdev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install capture dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu tmux

      - name: Install Codex harness
        run: npm install --global @openai/codex

      - name: Install Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/amf-screenshot-venv"
          "$RUNNER_TEMP/amf-screenshot-venv/bin/pip" install --disable-pip-version-check Pillow
          echo "$RUNNER_TEMP/amf-screenshot-venv/bin" >> "$GITHUB_PATH"

      - name: Build AMF
        run: cargo build --locked

      - name: Capture and prepare artifact
        env:
          SCENARIO: ${{ inputs.scenario }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CAPTURE_REF: ${{ inputs.ref }}
          GEOMETRY: ${{ inputs.geometry }}
          GIF_REQUESTED: ${{ inputs.gif }}
          SEED: ${{ inputs.seed }}
          SEED_FEATURE: ${{ inputs.seed_feature }}
          CONFIG_FILE: ${{ inputs.config }}
          OUT_DIR: ${{ runner.temp }}/amf-screenshot-output
        run: |
          set -euo pipefail
          [[ "$GEOMETRY" =~ ^[0-9]+x[0-9]+$ ]]
          [[ -f "$SCENARIO" ]]
          mkdir -p "$OUT_DIR"

          args=(--amf-bin "$GITHUB_WORKSPACE/target/debug/amf"
                --scenario "$SCENARIO" --out-dir "$OUT_DIR"
                --geometry "$GEOMETRY")
          [[ -n "$SEED" ]] && args+=(--seed "$SEED")
          [[ -n "$SEED_FEATURE" ]] && args+=(--seed-feature "$SEED_FEATURE")
          [[ -n "$CONFIG_FILE" ]] && args+=(--config "$CONFIG_FILE")
          [[ "$GIF_REQUESTED" == "true" ]] && args+=(--gif)
          scripts/dev/screenshot/amf-capture.sh "${args[@]}"

          if [[ "$GIF_REQUESTED" != "true" ]]; then
            cols="${GEOMETRY%x*}"
            rows="${GEOMETRY#*x}"
            shopt -s nullglob
            ansi_files=("$OUT_DIR"/*.ansi)
            shopt -u nullglob
            for ansi in "${ansi_files[@]}"; do
              python3 scripts/dev/screenshot/render_ansi.py "$ansi" \
                --out "${ansi%.ansi}.png" --cols "$cols" --rows "$rows"
            done
          fi

          python3 scripts/dev/screenshot/build_gallery.py \
            --input-dir "$OUT_DIR" --out "$OUT_DIR/gallery.html" \
            --repository "$GITHUB_REPOSITORY" --ref "$CAPTURE_REF" \
            --sha "$GITHUB_SHA" --scenario "$SCENARIO" \
            --geometry "$GEOMETRY" --pr-number "$PR_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --artifact-name "amf-screenshot-pr-${PR_NUMBER}-${GITHUB_RUN_ID}" \
            --retention-days 14

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: amf-screenshot-pr-${{ inputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/amf-screenshot-output
          if-no-files-found: error
          retention-days: 14

  publish_pages:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: screenshot-pages
    steps:
      # Do not check out inputs.ref here. That ref is allowed to run capture
      # code, but this job has the Cloudflare deployment credentials.
      - name: Download capture handoff
        uses: actions/download-artifact@v4
        with:
          name: amf-screenshot-pr-${{ inputs.pr_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/capture

      - name: Build restricted static gallery
        env:
          INPUT_DIR: ${{ runner.temp }}/capture
          OUTPUT_DIR: ${{ runner.temp }}/pages
          PR_NUMBER: ${{ inputs.pr_number }}
          FLOW_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python3 - <<'PY'
          import base64
          import html
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["INPUT_DIR"])
          destination = Path(os.environ["OUTPUT_DIR"])
          images = sorted(source.glob("*.png"))
          gifs = sorted(source.glob("*.gif"))
          allowed = images + gifs
          if not allowed:
              raise SystemExit("no rendered screenshots available for Pages")
          if any(path.stat().st_size > 10 * 1024 * 1024 for path in allowed):
              raise SystemExit("refusing to publish an image larger than 10 MiB")

          notes = {}
          notes_path = source / "capture-notes.jsonl"
          if notes_path.exists():
              for line in notes_path.read_text(encoding="utf-8").splitlines():
                  try:
                      item = json.loads(line)
                      notes[str(item.get("file", ""))] = str(item.get("note", ""))[:600]
                  except json.JSONDecodeError:
                      continue
          figures = []
          for path in allowed:
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              mime = "image/png" if path.suffix == ".png" else "image/gif"
              label = html.escape(path.stem.replace("-", " "))
              note = html.escape(notes.get(path.with_suffix(".ansi").name, ""))
              proof = f'<p><strong>What this proves:</strong> {note}</p>' if note else ""
              figures.append(
                  f'<figure><img src="data:{mime};base64,{encoded}" alt="{label}">'
                  f'<figcaption><strong>Step {len(figures) + 1}:</strong> {label}{proof}</figcaption></figure>'
              )
          pr = html.escape(os.environ["PR_NUMBER"])
          summary = html.escape(os.environ["FLOW_SUMMARY"][:600])
          (destination / "index.html").write_text(
              "<!doctype html><meta charset=utf-8>"
              f"<title>AMF screenshot proof — PR #{pr}</title>"
              "<style>body{margin:2rem auto;max-width:1100px;padding:0 1rem;background:#16181d;color:#e6e6e6;font:15px system-ui,sans-serif}.flow{margin:1rem 0 2rem;padding:1rem;border-left:3px solid #6ea8fe;background:#20242c}figure{margin:0 0 2rem}img{display:block;width:100%;height:auto;border:1px solid #424955;border-radius:8px}figcaption{padding:.65rem 0;color:#c7ced8}figcaption p{margin:.4rem 0 0}</style>"
              f"<h1>AMF screenshot proof — PR #{pr}</h1><section class=flow><strong>Flow under review</strong><p>{summary}</p></section><h2>Evidence walkthrough</h2>" + "".join(figures),
              encoding="utf-8",
          )
          PY
          cat > "$OUTPUT_DIR/_headers" <<'EOF'
          /*
            Content-Security-Policy: default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
            Referrer-Policy: no-referrer
            X-Content-Type-Options: nosniff
            X-Frame-Options: DENY
          EOF

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/pages --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=pr-${{ inputs.pr_number }}
