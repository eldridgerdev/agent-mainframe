name: Deploy site

# Builds site/ with Zola and deploys the result to Cloudflare Pages.
#
# Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and a
# Cloudflare Pages project matching `projectName` below (see site/README.md).
# The build always runs (it's a useful check on its own), but the deploy step
# is skipped — not failed — until CLOUDFLARE_API_TOKEN is set. That check is
# routed through the job-level `env.CF_TOKEN_SET` rather than referencing
# `secrets` directly in the step's `if:`, because GitHub Actions fails to
# parse a workflow that does the latter (the crates.io publish job in
# release.yml has the same bug — not yet fixed there).

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced directly in an `if:` conditional (GitHub
      # silently fails to parse the workflow); route through a plain env var.
      CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.23.5/zola-v0.23.5-x86_64-unknown-linux-gnu.tar.gz -o zola.tar.gz
          tar -xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola

      - name: Build
        working-directory: site
        run: zola build

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN_SET == 'true' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: agent-mainframe-site
          directory: site/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
