[workspace]
members = ["gui/src-tauri"]
# The workspace root is this package itself (the common root-crate-as-member
# layout) rather than a virtual manifest, so `amf`'s existing Cargo.toml
# location and publishing behavior are unchanged. No `resolver` override: the
# workspace inherits the root package's edition-2024 default (resolver "3").

[package]
name = "agent-mainframe"
version = "0.49.0"
edition = "2024"
description = "Terminal dashboard for running many AI coding agents in parallel — each on its own branch, in its own tmux session"
license = "MIT"
repository = "https://github.com/eldridgerdev/agent-mainframe"
readme = "README.md"
keywords = ["tui", "tmux", "agents", "claude", "worktree"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://agentmainframe.dev"
# Keep the packaged .crate under crates.io's 10MB compressed hard cap (an
# oversized upload gets rejected with a 413 that their CDN mangles into an
# opaque 503 — see docs/backlog/crate-package-size-plan.md). Everything
# excluded here is dev tooling / docs with no `include_str!`/`include_bytes!`
# reference from src/; docs/tsx-syntax-test.tsx and docs/syntax-tests/ are
# kept because src/highlight and src/ui/dialogs/diff.rs embed them.
exclude = [
    ".opencode/settings.json",
    ".opencode/commands",
    ".opencode/opencode.json",
    ".opencode/themes",
    "/.agents",
    "/.claude",
    "/.codex",
    "/docker",
    "/examples",
    "/site",
    "/docs/automation",
    "/docs/backlog",
    "/docs/batched-review.md",
    "/docs/context-usage-telemetry.md",
    "/docs/development",
    "/docs/docker-no-tmux.md",
    "/docs/final-review-subagent-notes-investigation.md",
    "/docs/repository-cleanup-audit.md",
    "/docs/screenshots",
    "/docs/usability-review.md",
    "/gui",
]

[lib]
name = "agent_mainframe"
path = "src/lib.rs"

[[bin]]
name = "amf"
path = "src/main.rs"

[dependencies]
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which measures
# a paragraph with the exact `WordWrapper` the renderer uses. Scroll clamps that
# need post-wrap row counts use it instead of re-deriving Ratatui's wrapping.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
throbber-widgets-tui = "0.8"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
vt100 = "0.15"
ratatui-explorer = "0.2"
ureq = { version = "3", default-features = false, features = ["gzip", "platform-verifier", "rustls"] }
unicode-width = "0.1"
regex = "1"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.26"
pulldown-cmark = "0.13"
tempfile = "3"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8.2.0"
# Dedicated async runtime for the Remote Control companion-app server
# (docs/backlog/remote-control-companion-app-plan.md, Epic 1). Runs only on
# its own thread, started/stopped by an explicit user toggle — the rest of
# AMF stays synchronous.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
# Pairing (Epic 4): rendering the pairing QR in the terminal. Token hashing
# (`src/db/remote_devices.rs` never sees a plaintext token) reuses the `sha2`
# dependency above.
qrcode = { version = "0.14", default-features = false }
# Web Push for the Remote Control PWA: payload encryption only. The crate's
# `vapid` feature would pull in jwt-simple (RSA, Ed25519, P-384, ML-DSA, …) to
# make one ES256 signature; `src/remote_push.rs` signs it with `p256` instead.
web-push-native = { version = "0.5", default-features = false }
p256 = { version = "0.13", features = ["ecdsa"] }
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
mockall = "0.13"
pretty_assertions = "1"
# A blocking WebSocket client for the Remote Control terminal-socket tests;
# already in the tree through axum's `ws` feature.
tungstenite = "0.29"
