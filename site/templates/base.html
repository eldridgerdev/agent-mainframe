<!DOCTYPE html>
<html lang="{{ lang | default(value=config.default_language) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="icon" href="{{ get_url(path="favicon.svg") }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav">
      <a class="brand" href="{{ get_url(path="/") }}">
        <span class="brand-glyph">&gt;_</span> Agent Mainframe
      </a>
      <div class="nav-links">
        <a href="{{ get_url(path="docs/") }}">Docs</a>
        <a href="{{ config.extra.releases_url }}">Releases</a>
        <a href="{{ config.extra.github_url }}">GitHub</a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <p>
      Agent Mainframe is open source under the MIT License.
      <a href="{{ config.extra.github_url }}">Source on GitHub</a>.
    </p>
  </footer>
</body>
</html>
