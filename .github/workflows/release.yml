name: Release

on:
  push:
    tags:
      - "v[0-9]*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --locked

  publish-crate:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    # Steps below are skipped (not failed) until CARGO_REGISTRY_TOKEN is set
    # on the repo, so tag pushes keep releasing GitHub binaries while
    # crates.io publishing is being set up. This can't be a job-level `if:`
    # on `secrets.CARGO_REGISTRY_TOKEN` — GitHub Actions fails to parse a
    # workflow that references `secrets` directly in an `if:` conditional —
    # so the check is routed through a job-level env var and applied to each
    # step instead (same fix as site.yml's deploy job).
    env:
      CARGO_TOKEN_SET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.CARGO_TOKEN_SET == 'true' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: ${{ env.CARGO_TOKEN_SET == 'true' }}

      - name: cargo publish
        if: ${{ env.CARGO_TOKEN_SET == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            use_cross: true
            install_musl: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.install_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Setup OpenSSL for musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include/openssl" >> $GITHUB_ENV

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install tmux for macOS bundle
        if: matrix.target == 'aarch64-apple-darwin'
        run: brew install tmux

      - name: Package release bundle
        run: |
          src="target/${{ matrix.target }}/release/amf"
          dst="dist/amf-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          strip "$src" 2>/dev/null || true
          bash scripts/dev/package-release-bundle.sh "${{ matrix.target }}" "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amf-${{ matrix.target }}
          path: dist/amf-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build-gui:
    name: Build GUI (x86_64-unknown-linux-gnu)
    needs: test
    # 22.04 rather than latest: an AppImage only runs on systems whose glibc
    # is at least as new as the one it was built against, so the oldest
    # supported runner reaches the most distros. The .deb targets the same
    # systems. Linux x86_64 also covers Windows through WSL2/WSLg; macOS is
    # left out until its runtime and signing have been checked.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gui-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gui-${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      # The GUI's own manifest version is not bumped by release.sh; stamp the
      # bundles with the tag's version so both interfaces carry one number.
      - name: Build .deb and AppImage
        working-directory: gui
        run: |
          version="${GITHUB_REF_NAME#v}"
          rm -rf ../target/release/bundle
          npm run tauri -- build --ci --bundles deb,appimage \
            --config "{\"version\":\"$version\"}"

      - name: Collect bundles
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/bundle/deb/*_"${version}"_amd64.deb \
            dist/amf-gui-x86_64-unknown-linux-gnu.deb
          cp target/release/bundle/appimage/*_"${version}"_amd64.AppImage \
            dist/amf-gui-x86_64-unknown-linux-gnu.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amf-gui-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, build-gui]
    # The GUI is a preview: publish the TUI release even if its bundle
    # failed. The failed job stays visible on the workflow run.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifacts
        run: find artifacts -type f -exec mv {} artifacts/ \; && find artifacts -type d -empty -delete

      - name: Validate changelog for major/minor releases
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' \
            | sed -n '2p')

          CURRENT="${CURRENT_TAG#v}"
          IFS=. read -r CUR_MAJOR CUR_MINOR CUR_PATCH <<< "$CURRENT"

          require_changelog=0
          if [ -z "$PREV_TAG" ]; then
            require_changelog=1
          else
            PREV="${PREV_TAG#v}"
            IFS=. read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$PREV"
            if [ "$CUR_MAJOR" -gt "$PREV_MAJOR" ]; then
              require_changelog=1
            elif [ "$CUR_MAJOR" -eq "$PREV_MAJOR" ] && \
              [ "$CUR_MINOR" -gt "$PREV_MINOR" ]; then
              require_changelog=1
            fi
          fi

          if [ "$require_changelog" -eq 1 ]; then
            grep -Eq "^## \[$CURRENT_TAG\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          fi

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          SECTION_LINE=$(awk -v tag="$CURRENT_TAG" '
            $0 ~ "^## \\[" tag "\\] - " { print NR; exit }
          ' CHANGELOG.md)

          if [ -z "$SECTION_LINE" ]; then
            echo "Error: could not find a changelog section for ${CURRENT_TAG}." >&2
            exit 1
          fi

          BODY=$(awk -v tag="$CURRENT_TAG" '
            $0 ~ "^## \\[" tag "\\] - " { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md)

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "_Full changelog section: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${CURRENT_TAG}/CHANGELOG.md#L${SECTION_LINE})_" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: artifacts/*
